[platformio]
default_envs = esp32-c3-devkitm, uno

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-D LORA_TEST_SENDER=1
	-D LORA_NODE_NAME=\"ESP-SENDER\"
	-D LORA_UART_NUM=2
	-D LORA_RX_PIN=16
	-D LORA_TX_PIN=17
	-D LORA_E220_M0_PIN=4
	-D LORA_E220_M1_PIN=5
	-D LORA_E220_AUX_PIN=18

[env:esp32-c3-devkitm]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D LORA_TEST_SENDER=1
	-D LORA_NODE_NAME=\"ESP-C3-SENDER\"
	-D LORA_UART_NUM=1
	-D LORA_RX_PIN=20
	-D LORA_TX_PIN=21
	-D LORA_E220_M0_PIN=4
	-D LORA_E220_M1_PIN=5
	-D LORA_E220_AUX_PIN=6

[env:esp32-s3-devkitm]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D LORA_TEST_SENDER=1
	-D LORA_NODE_NAME=\"ESP-SENDER\"
	-D LORA_UART_NUM=2
	-D LORA_RX_PIN=16
	-D LORA_TX_PIN=17
	-D LORA_E220_M0_PIN=4
	-D LORA_E220_M1_PIN=5
	-D LORA_E220_AUX_PIN=18

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
	-D LORA_TEST_SENDER=0
	-D LORA_ALLOW_MANUAL_TX=0
	-D LORA_AUTO_SEND_MS=0
	-D LORA_NODE_NAME=\"UNO-RECEIVER\"
	-D LORA_RX_PIN=10
	-D LORA_TX_PIN=11
	-D LORA_E220_M0_PIN=7
	-D LORA_E220_M1_PIN=6
	-D LORA_E220_AUX_PIN=5
