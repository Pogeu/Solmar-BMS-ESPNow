; PlatformIO Project Configuration File
;
; Gateway firmware: RS485 Modbus input with ESP-NOW, SPI display, microSD, and MQTT
; telemetry options.

[platformio]
default_envs = esp32-s3-gateway

[env:esp32-s3-gateway]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 9600
build_flags =
	-D SERIAL_ONLY_MODE=1
	-D ESP_NOW_ENABLE=1
	-D ESP_NOW_WIFI_CHANNEL=1
	-I ../../shared
	-D RS485_RX_PIN=0
	-D RS485_DE_RE_PIN=1
	-D RS485_TX_PIN=2

[env:espnow-packet-test]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 9600
test_framework = unity
test_build_src = no
build_flags =
	-D SERIAL_ONLY_MODE=1
	-D ESP_NOW_ENABLE=1
	-D ESP_NOW_WIFI_CHANNEL=1
	-I ../../shared

[env:esp32-s3-gateway-lcd-direct]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 9600
build_flags =
	-D SERIAL_ONLY_MODE=1
	-D ESP_NOW_ENABLE=0
	-D BMS_LCD_DIRECT_MODE=1
	-D SD_LOG_ENABLE=1
	-I ../../shared
	-D RS485_RX_PIN=0
	-D RS485_DE_RE_PIN=1
	-D RS485_TX_PIN=2
	-D DISPLAY_SPI_SCK_PIN=4
	-D DISPLAY_SPI_MOSI_PIN=6
	-D DISPLAY_CS_PIN=15
	-D DISPLAY_DC_PIN=16
	-D DISPLAY_RESET_PIN=17
	-D DISPLAY_PAGE_BUTTON_PIN=10
	-D DISPLAY_CONTRAST=45
	-D DISPLAY_FILLED_PROGRESS_BAR=0
	-D DISPLAY_USE_ERC12864_ALT=1
	-D SD_LOG_USE_DEFAULT_SPI_PINS=0
	-D SD_LOG_CS_PIN=7
	-D SD_LOG_SCK_PIN=4
	-D SD_LOG_MISO_PIN=5
	-D SD_LOG_MOSI_PIN=6
lib_deps =
	olikraus/U8g2

[env:esp32-s3-gateway-lcd-direct-mqtt]
extends = env:esp32-s3-gateway-lcd-direct
build_flags =
	${env:esp32-s3-gateway-lcd-direct.build_flags}
	-D BMS_MQTT_ENABLE=1
	-D BMS_MQTT_HOST=\"broker.hivemq.com\"
	-D BMS_MQTT_PORT=1883
	-D BMS_MQTT_TOPIC_BASE=\"solmar/bms/felicity-fla12171\"
	-D BMS_WIFI_AP_NAME=\"Solmar-BMS-Setup\"
	-D BMS_WIFI_CONFIG_PORTAL_TIMEOUT_SECONDS=120
lib_deps =
	${env:esp32-s3-gateway-lcd-direct.lib_deps}
	tzapu/WiFiManager@^2.0.17
	knolleary/PubSubClient@^2.8

[env:esp32-s3-central-a7670]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D SERIAL_ONLY_MODE=1
	-D SERIAL_DEBUG_BAUD=115200
	-D BMS_CENTRAL_MODE=1
	-D BMS_LCD_DIRECT_MODE=0
	-D SD_LOG_ENABLE=0
	-D ESP_NOW_ENABLE=1
	-D ESP_NOW_WIFI_CHANNEL=1
	-I ../../shared
	-D RS485_RX_PIN=4
	-D RS485_DE_RE_PIN=6
	-D RS485_TX_PIN=5
	-D BMS_MQTT_ENABLE=1
	-D BMS_INTERNET_SOURCE=4
	-D BMS_MQTT_HOST=\"broker.hivemq.com\"
	-D BMS_MQTT_PORT=1883
	-D BMS_MQTT_TOPIC_BASE=\"solmar/bms/felicity-fla12171\"
	-D BMS_WIFI_AP_NAME=\"Solmar-BMS-Setup\"
	-D BMS_WIFI_CONFIG_PORTAL_TIMEOUT_SECONDS=300
	-D BMS_WIFI_CONNECT_TIMEOUT_SECONDS=30
	-D BMS_OTA_ENABLE=1
	-D BMS_OTA_HOSTNAME=\"solmar-central\"
	-D BMS_OTA_PASSWORD=\"solmar-ota\"
	-D BMS_A7670_ENABLE=1
	-D BMS_A7670_UART_NUM=0
	-D BMS_A7670_BAUD=115200
	-D BMS_A7670_RX_PIN=9
	-D BMS_A7670_TX_PIN=10
	-D BMS_A7670_PWRKEY_PIN=7
	-D BMS_A7670_RESET_PIN=-1
	-D BMS_A7670_APN=\"zap.vivo.com.br\"
	-D BMS_LOCATION_ENABLE=1
	-D BMS_NEO6M_ENABLE=1
	-D BMS_NEO6M_USE_SOFTWARE_SERIAL=1
	-D BMS_NEO6M_RX_PIN=15
	-D BMS_NEO6M_TX_PIN=-1
	-D BMS_NEO6M_BAUD=9600
	-D BMS_LOCATION_PUBLISH_INTERVAL_MS=10000
	-D BMS_LORA_ENABLE=1
	-D BMS_LORA_BACKEND=2
	-D BMS_LORA_UART_NUM=2
	-D BMS_LORA_BAUD=9600
	-D BMS_LORA_RX_PIN=16
	-D BMS_LORA_TX_PIN=17
	-D BMS_LORA_E220_M0_PIN=18
	-D BMS_LORA_E220_M1_PIN=8
	-D BMS_LORA_E220_AUX_PIN=3
	-D BMS_LORA_MIN_INTERVAL_MS=5000
	-D BMS_LORA_BATTERY_INFO_ONLY=1
lib_deps =
	tzapu/WiFiManager@^2.0.17
	knolleary/PubSubClient@^2.8
	plerup/EspSoftwareSerial@^8.2.0

[env:esp32-s3-central-a7670-ota]
extends = env:esp32-s3-central-a7670
upload_protocol = espota
upload_port = solmar-central.local
upload_flags =
	--auth=solmar-ota

[env:esp32-s3-central-front-demo]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D SERIAL_ONLY_MODE=1
	-D SERIAL_DEBUG_BAUD=115200
	-D BMS_CENTRAL_MODE=1
	-D BMS_CENTRAL_DEMO_ESPNOW=1
	-D BMS_LCD_DIRECT_MODE=0
	-D SD_LOG_ENABLE=0
	-D ESP_NOW_ENABLE=1
	-D ESP_NOW_WIFI_CHANNEL=1
	-D BMS_MQTT_ENABLE=0
	-D BMS_A7670_ENABLE=0
	-D BMS_LOCATION_ENABLE=0
	-D BMS_LORA_ENABLE=0
	-I ../../shared

[env:esp32-s3-gateway-lcd-direct-lora-e90-dtu]
extends = env:esp32-s3-gateway-lcd-direct
build_flags =
	${env:esp32-s3-gateway-lcd-direct.build_flags}
	-D BMS_LORA_ENABLE=1
	-D BMS_LORA_BACKEND=1
	-D BMS_LORA_UART_NUM=2
	-D BMS_LORA_BAUD=9600
	-D BMS_LORA_RX_PIN=14
	-D BMS_LORA_TX_PIN=13
	-D BMS_LORA_E90_DE_RE_PIN=12
	-D BMS_LORA_MIN_INTERVAL_MS=5000
	-D BMS_LORA_BATTERY_INFO_ONLY=1
lib_deps =
	${env:esp32-s3-gateway-lcd-direct.lib_deps}

[env:esp32-s3-gateway-lcd-direct-lora-e220]
extends = env:esp32-s3-gateway-lcd-direct
build_flags =
	${env:esp32-s3-gateway-lcd-direct.build_flags}
	-D BMS_LORA_ENABLE=1
	-D BMS_LORA_BACKEND=2
	-D BMS_LORA_UART_NUM=2
	-D BMS_LORA_BAUD=9600
	-D BMS_LORA_RX_PIN=14
	-D BMS_LORA_TX_PIN=13
	-D BMS_LORA_E220_M0_PIN=11
	-D BMS_LORA_E220_M1_PIN=12
	-D BMS_LORA_E220_AUX_PIN=18
	-D BMS_LORA_MIN_INTERVAL_MS=5000
	-D BMS_LORA_BATTERY_INFO_ONLY=1
lib_deps =
	${env:esp32-s3-gateway-lcd-direct.lib_deps}

[env:esp32-s3-gateway-display-test]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 9600
build_flags =
	-D SERIAL_ONLY_MODE=1
	-D ESP_NOW_ENABLE=0
	-D BMS_LCD_DIRECT_MODE=1
	-D BMS_DISPLAY_STANDALONE_TEST=1
	-D DISPLAY_CONTRAST=45
	-D DISPLAY_FILLED_PROGRESS_BAR=0
	-D DISPLAY_USE_ERC12864_ALT=1
	-I ../../shared
	-D DISPLAY_SPI_SCK_PIN=4
	-D DISPLAY_SPI_MOSI_PIN=6
	-D DISPLAY_CS_PIN=15
	-D DISPLAY_DC_PIN=16
	-D DISPLAY_RESET_PIN=17
	-D DISPLAY_PAGE_BUTTON_PIN=10
lib_deps =
	olikraus/U8g2
