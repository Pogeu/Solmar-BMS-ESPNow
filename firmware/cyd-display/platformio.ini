; ESP32-2432S028R / Cheap Yellow Display battery screen

[platformio]
default_envs = esp32-cyd-battery-screen

[env:esp32-cyd-battery-screen]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-I ../../shared
	-D ESP_NOW_WIFI_CHANNEL=1
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TOUCH_CS=33
	-D TOUCH_SCLK_PIN=25
	-D TOUCH_MISO_PIN=39
	-D TOUCH_MOSI_PIN=32
	-D TOUCH_IRQ_PIN=36
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=16000000
	-D SPI_TOUCH_FREQUENCY=2500000
lib_deps =
	bodmer/TFT_eSPI@^2.5.43

[env:esp32-cyd-battery-screen-demo]
extends = env:esp32-cyd-battery-screen
build_flags =
	${env:esp32-cyd-battery-screen.build_flags}
	-D CYD_STANDALONE_TEST=1
